services:
  redis:
    image: redis:7-alpine
    container_name: telego-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --appendfsync everysec
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  telego-bot-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telego-bot-api
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      - TELEGO_API_ID=${TELEGO_API_ID:-2040}
      - TELEGO_API_HASH=${TELEGO_API_HASH:-b18441a1ff607e10a989891a5462e627}
      - TELEGO_HTTP_ADDR=${TELEGO_HTTP_ADDR:-0.0.0.0:8082}
      - TELEGO_REDIS_ADDR=redis:6379
      - TELEGO_REDIS_PASSWORD=${TELEGO_REDIS_PASSWORD:-}
      - TELEGO_LOG_LEVEL=${TELEGO_LOG_LEVEL:-info}
      - TELEGO_LOG_FORMAT=${TELEGO_LOG_FORMAT:-json}
      - TELEGO_PPROF_ADDR=${TELEGO_PPROF_ADDR:-}
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8082/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  redis_data:
